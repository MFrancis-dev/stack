[package]
name = "stack-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
# `unstable` enables compile_project, which builds the contracts by running the `cargo near` CLI
# (installed locally and in CI: cargo-near 0.22.0).
near-workspaces = { version = "=0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
