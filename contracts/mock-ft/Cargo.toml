[package]
name = "stack-mock-ft"
version = "0.1.0"
edition = "2021"
publish = false
description = "NEP-141/NEP-145 token used only by the integration tests (stands in for USDC)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
